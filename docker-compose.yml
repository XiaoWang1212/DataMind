services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datamind-backend
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      FLASK_DEBUG: "false"
      CORS_ORIGIN: http://localhost:5173
      WHISPER_MODEL: base
      UPLOAD_DIR: uploads
      MAX_CONTENT_LENGTH_MB: 25
    volumes:
      - ./backend/uploads:/app/uploads
      - whisper-cache:/root/.cache/whisper
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: datamind-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://ideally-strewn-papyrus.ngrok-free.dev
    volumes:
      - n8n_data:/home/node/.n8n

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datamind-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whisper-cache:
  n8n_data: 
