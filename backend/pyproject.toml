[project]
name = "datamind-backend"
version = "0.1.0"
description = "DataMind Flask backend with local Whisper STT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask==3.1.0",
  "flask-cors==5.0.0",
  "python-dotenv==1.0.1",
  "openai-whisper",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
