[project]
name = "datamind-backend"
version = "0.1.0"
description = "DataMind Flask backend with local Whisper STT"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "mineru[all]",
  "flask",
  "flask-cors",
  "scikit-learn",
  "google-generativeai",
  "whisper",
  "xgboost",
  "lightgbm",
  "catboost",
  "imbalanced-learn"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
