[project]
name = "datamind-backend"
version = "0.1.0"
description = "DataMind Flask backend with local Whisper STT"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "mineru[core]>=2.7,<3",
  "torch",
  "pymupdf",
  "flask",
  "flask-cors",
  "scikit-learn",
  "google-generativeai",
  "google-genai",
  "openai-whisper",
  "xgboost",
  "lightgbm",
  "catboost",
  "imbalanced-learn",
  "seaborn",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.2",
  "flask-sqlalchemy>=3.1.1",
  "flask-login>=0.6.3",
  "alembic>=1.18.5",
  "psycopg2-binary>=2.9.12",
  "bcrypt>=5.0.0",
  "pgvector>=0.5.0",
  "google-auth>=2.49.1",
]

[dependency-groups]
dev = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# torch 只在容器裡跑 CPU 推論（Whisper/mineru 用到，docker-compose.yml 沒有設定 GPU
# 直通），改抓 PyTorch 官方的 CPU-only wheel，避免預設在 Linux 上連帶下載整包
# nvidia-*-cu12 CUDA 函式庫（好幾 GB，且完全用不到）。只對 Linux 生效，
# Windows/macOS 本機開發維持原本的解析方式。
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
